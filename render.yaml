services:
  - type: web
    name: chairspace
    runtime: node
    plan: free
    buildCommand: "echo 'no build step needed'"
    startCommand: "node server.js"
    envVars:
      - key: NODE_VERSION
        value: 22.9.0
    # NOTE: the free plan does not support a persistent disk, so the SQLite
    # database (chairspace.db) will reset whenever the service redeploys or
    # is rebuilt. Fine for demo/testing. For real persistence, upgrade this
    # service to a paid instance type and add a disk, e.g.:
    #
    # disk:
    #   name: chairspace-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
    #
    # ...and update db.js's DB_PATH to point inside that mounted directory.
