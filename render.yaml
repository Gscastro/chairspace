services:
  - type: web
    name: chairspace
    runtime: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node server.js"
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      # DATABASE_URL: the connection string for your free Postgres database
      # (e.g. from neon.tech). `sync: false` means Render won't overwrite it
      # from this file — set the actual value once in the Render dashboard
      # under this service's Environment tab.
      - key: DATABASE_URL
        sync: false
      # Cloudinary — used for photo uploads (so uploaded photos survive
      # redeploys too). Either paste the single CLOUDINARY_URL Cloudinary
      # gives you on signup, OR fill in the three separate values below.
      # You only need one of these two approaches, not both.
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
    # ChairSpace uses a real Postgres database (via DATABASE_URL above) and
    # Cloudinary for photo storage, so data and photos persist across redeploys
    # and free-plan spin-downs — no disk needed. The buildCommand above runs
    # `npm install` so the `pg` package (the only real dependency) gets
    # installed on every deploy.
